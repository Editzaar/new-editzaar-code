  <style>
    .modal-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.82);
      z-index:900;
      display:flex; align-items:center; justify-content:center;
      padding:20px; display:none;
    }
    .modal-overlay.open { display:flex; }
    .modal-box {
      background:var(--bg-card);
      border:1px solid var(--gold-border);
      border-radius:14px; padding:36px;
      width:100%; max-width:540px;
      max-height:90vh; overflow-y:auto; position:relative;
    }
    .modal-title { font-family:var(--font-h); font-size:1.5rem; margin-bottom:24px; }
    .modal-close {
      position:absolute; top:16px; right:16px;
      background:none; border:none; color:var(--t2);
      font-size:1.4rem; cursor:pointer; transition:color 0.2s;
    }
    .modal-close:hover { color:var(--gold); }
    .filter-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .filter-select {
      background:rgba(255,255,255,0.04); border:1px solid var(--border);
      border-radius:7px; padding:8px 12px; color:inherit;
      font-family:var(--font-b); font-size:0.85rem; outline:none; transition:border-color 0.2s;
    }
    .filter-select:focus { border-color:var(--gold); }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: #28C840;
      background: rgba(40,200,64,0.1); border: 1px solid rgba(40,200,64,0.3);
      padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #28C840; animation: pulseDot 1.5s infinite; }
    @keyframes pulseDot { 0%,100%{ opacity: 1; } 50%{ opacity: 0.3; } }

    .btn-danger {
      background: rgba(255,77,77,0.15); border: 1px solid rgba(255,77,77,0.4);
      color: #FF4D4D; font-size: 13px; padding: 4px 10px; border-radius: 4px;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-danger:hover { background: #FF4D4D; color: inherit; }

    .chat-overlook-grid {
      display: flex; flex-direction: row; gap: 16px; min-height: 520px;
    }
    .chat-proj-list {
      width: 280px; min-width: 240px; flex-shrink: 0;
      background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      border-radius: 8px; overflow-y: auto; padding: 10px; max-height: 520px;

    .chat-proj-item {
      padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
      margin-bottom: 6px; border: 1px solid transparent; transition: all 0.2s;
      word-break: break-word; overflow-wrap: break-word;
    }
    .chat-proj-item:hover, .chat-proj-item.active {
      background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold);
    }
    .chat-container {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      background: var(--bg-card2); border: 1px solid var(--border);
      border-radius: 10px; height: 520px;
    }

    @media (max-width: 900px) {
      .dash-main {
        padding: 64px 12px calc(var(--bottom-nav-h) + 24px + var(--safe-bottom)) 12px !important;
      }
      .dash-topbar {
        padding-left: 48px !important; /* Offset for floating hamburger icon */

      .dash-page-title {
        font-size: 1.35rem !important;
      }
      .chat-overlook-grid {
        flex-direction: column !important;
        min-height: auto !important;
        gap: 12px !important;
      }
      .chat-proj-list {
        width: 100% !important;

        max-height: 140px !important;
      }
      .chat-container {
        width: 100% !important;

        height: 420px !important;

    .pass-pill {
      font-family: monospace; font-size: 13px; color: var(--gold);
      background: rgba(255,184,0,0.1); border: 1px solid var(--gold-border);
      padding: 2px 8px; border-radius: 4px; display: inline-block;

    .editor-assign-select {
      background: rgba(255,184,0,0.06); border: 1px solid var(--gold-border);
      color: var(--gold); border-radius: 6px; padding: 4px 8px; font-size: 13px;
      outline: none; cursor: pointer;
    }
    
    /* New Styles */
    .kanban-board {
      display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px;
    }
    .kanban-column {
      min-width: 220px; flex: 1;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px;
    }
    .kanban-column h4 { margin: 0 0 10px 0; color: var(--gold); font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .kanban-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s;

    .kanban-card:hover { border-color: var(--gold); }
    .kanban-card-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .kanban-card-meta { font-size: 0.75rem; color: var(--t2); }
    
    .workload-bar-bg { width: 100%; background: rgba(255,255,255,0.1); border-radius: 3px; height: 6px; overflow: hidden; }
    .workload-bar { height: 6px; background: var(--gold); border-radius: 3px; display: block; }
    
    .tab-btn { background: none; border: none; color: var(--t2); font-family: var(--font-b); font-size: 1rem; padding: 8px 16px; cursor: pointer; }
    .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
    
    .perf-bar { height: 10px; border-radius: 5px; display: inline-block; }
    .report-container { background: rgba(255,255,255,0.02); padding: 20px; border: 1px solid var(--border); border-radius: 8px; margin-top: 20px; }

    /* Permissions Toggle Items */
    .perm-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      margin-bottom: 8px;
    }
    .perm-item:hover {
      border-color: var(--gold);
      background: rgba(255, 184, 0, 0.04);
    }
    .perm-item.checked {
      border-color: var(--gold) !important;
      background: rgba(255, 184, 0, 0.08) !important;
    }
    .perm-box {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: #000;
    }
    .perm-item:hover .perm-box {
      border-color: var(--gold);
    }
    .perm-item.checked .perm-box {
      background: var(--gold) !important;
      border-color: var(--gold) !important;
      color: #000 !important;
    }
    .perm-svg {
      display: none;
    }
    .perm-item.checked .perm-svg {
      display: block;
    }
    .perm-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--t1);
      margin-bottom: 2px;
    }
    .perm-item.checked .perm-title {
      color: var(--gold);
    }
    .perm-desc {
      font-size: 0.8rem;
      color: var(--t2);
      line-height: 1.35;
    }
    .perm-category-header {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gold);
      margin: 18px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>

      { id: 'v11', type: 'horizontal', title: 'Lifestyle Chronological Montage', niche: 'Lifestyle', videoUrl: 'https://pub-fb141b1eee8144558197aeb16a8d9589.r2.dev/long%20video/long%20video%205%20.mp4', order: 11 },

      { id: 'v13', type: 'horizontal', title: 'Educational & Informational', niche: 'Educational', videoUrl: 'https://pub-fb141b1eee8144558197aeb16a8d9589.r2.dev/long%20video/long%20video%207.mp4', order: 13 }

  var DEFAULT_STARTER_WEBSITES = [
      { id: 'w1', name: 'D Plus Cure', url: 'https://dpluscure.com', niche: 'Healthcare E-Commerce', tech: 'WordPress, WooCommerce, PHP, Elementor', speed: '92/100', order: 1 },
      { id: 'w2', name: 'News Flash Daily', url: 'https://newsflashdaily.in', niche: 'News & Media Portal', tech: 'WordPress, SEO Suite, AMP, Custom Theme', speed: '96/100', order: 2 },
      { id: 'w3', name: 'Editzaar Agency', url: 'https://editzaar.in', niche: 'Creative Agency Portfolio', tech: 'HTML5, CSS3, JavaScript, Firebase Cloud', speed: '98/100', order: 3 }
    ];

  var allCmsVideos = [...DEFAULT_STARTER_VIDEOS];

  var currentVidFilter = 'all';

  window.switchCmsTab = function(tabName) {
    var tabs = ['portfolio_videos', 'portfolio_web', 'testimonials', 'faqs', 'contact'];
    tabs.forEach(function(t) {
      var btn = document.getElementById('tab-cms-' + (t === 'portfolio_videos' ? 'video' : (t === 'portfolio_web' ? 'web' : (t === 'testimonials' ? 'testi' : (t === 'faqs' ? 'faq' : 'contact')))));
      var container = document.getElementById('cms-tab-' + t);
      if (btn) {
        if (t === tabName) btn.classList.add('active');
        else btn.classList.remove('active');
      }
      if (container) {
        if (t === tabName) container.style.display = 'block';
        else container.style.display = 'none';
      }
    });
  };

  // Real-time listener for Portfolio Videos with Auto-Seeding
  function initPortfolioCmsListeners() {
    renderCmsVideos();
    renderCmsWebsites();

    try {
      onSnapshot(collection(db, 'portfolio_videos'), function(snapshot) {
        if (snapshot.empty) {
          // Auto-seed to Firestore if collection is empty
          if (!hasSeededVideos) {
            hasSeededVideos = true;
            autoSeedVideosToFirestore();
          }
          allCmsVideos = [...DEFAULT_STARTER_VIDEOS];
        } else {
          allCmsVideos = [];
          snapshot.forEach(function(docSnap) {
            var data = docSnap.data();
            data.id = docSnap.id;
            allCmsVideos.push(data);
          });
          allCmsVideos.sort(function(a, b) { return (a.order || 1) - (b.order || 1); });
        }
        renderCmsVideos();
      }, function(err) {
        console.error('Error listening to portfolio_videos:', err);
        renderCmsVideos();
      });

      onSnapshot(collection(db, 'portfolio_websites'), function(snapshot) {
        if (snapshot.empty) {
          if (!hasSeededWebsites) {
            hasSeededWebsites = true;
            autoSeedWebsitesToFirestore();
          }
          allCmsWebsites = [...DEFAULT_STARTER_WEBSITES];
        } else {
          allCmsWebsites = [];
          snapshot.forEach(function(docSnap) {
            var data = docSnap.data();
            data.id = docSnap.id;
            allCmsWebsites.push(data);
          });
          allCmsWebsites.sort(function(a, b) { return (a.order || 1) - (b.order || 1); });
        }
        renderCmsWebsites();
      }, function(err) {
        console.error('Error listening to portfolio_websites:', err);
        renderCmsWebsites();
      });
    } catch(e) {
      console.error('initPortfolioCmsListeners error:', e);
    }
  }

  async function autoSeedVideosToFirestore() {
    try {
      for (var i = 0; i < DEFAULT_STARTER_VIDEOS.length; i++) {
        var s = DEFAULT_STARTER_VIDEOS[i];
        await addDoc(collection(db, 'portfolio_videos'), {
          title: s.title,
          type: s.type,
          niche: s.niche,
          videoUrl: s.videoUrl,
          order: s.order,
          active: true,
          createdAt: serverTimestamp()
        });
      }
    } catch(e) {
      console.log('Auto-seed videos note:', e);
    }
  }

  async function autoSeedWebsitesToFirestore() {
    try {
      for (var i = 0; i < DEFAULT_STARTER_WEBSITES.length; i++) {
        var s = DEFAULT_STARTER_WEBSITES[i];
        await addDoc(collection(db, 'portfolio_websites'), {
          name: s.name,
          url: s.url,
          niche: s.niche,
          tech: s.tech,
          speed: s.speed,
          order: s.order,
          active: true,
          createdAt: serverTimestamp()
        });
      }
    } catch(e) {
      console.log('Auto-seed websites note:', e);
    }
  }

  function renderCmsVideos() {
    var tbody = document.getElementById('cmsVideosTbody');
    if (!tbody) return;

    var countEl = document.getElementById('count-all-vids');
    if (countEl) countEl.innerText = allCmsVideos.length;

    var filtered = allCmsVideos.filter(function(v) {
      if (currentVidFilter === 'all') return true;
      return v.type === currentVidFilter;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--t2);padding:24px;">No videos found matching this filter. Click <strong>"＋ Add New Video"</strong> above!</td></tr>`;
      return;
    }

    var html = '';
    filtered.forEach(function(v) {
      var isVert = v.type === 'vertical';
      var badge = isVert ? '<span style="background:rgba(255,184,0,0.15);color:var(--gold);padding:4px 8px;border-radius:12px;font-size:0.76rem;font-weight:600;">📱 9:16 Vertical</span>' : '<span style="background:rgba(0,200,255,0.15);color:#00c8ff;padding:4px 8px;border-radius:12px;font-size:0.76rem;font-weight:600;">🖥️ 16:9 Horizontal</span>';
      
      html += `<tr>
        <td style="width:80px;">
          <div style="width:60px;height:${isVert ? '80px' : '45px'};background:#000;border-radius:6px;overflow:hidden;position:relative;">
            <video src="${v.videoUrl}" style="width:100%;height:100%;object-fit:cover;" muted></video>
          </div>
        </td>
        <td><strong>${v.title || 'Untitled'}</strong></td>
        <td>${badge}</td>
        <td><span class="tech-badge" style="font-size:0.78rem;">${v.niche || 'General'}</span></td>
        <td>${v.order || 1}</td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="btn-outline btn-sm" onclick="window.editCmsVideo('${v.id}')">✏️ Edit</button>
            <button class="btn-danger btn-sm" onclick="window.deleteCmsVideo('${v.id}')">🗑️ Delete</button>
          </div>
        </td>
      </tr>`;
    });
    tbody.innerHTML = html;
  }

  function renderCmsWebsites() {
    var tbody = document.getElementById('cmsWebsitesTbody');
    if (!tbody) return;

    if (allCmsWebsites.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--t2);padding:24px;">No website projects added yet. Click <strong>"＋ Add New Website"</strong> above!</td></tr>`;
      return;
    }

    var html = '';
    allCmsWebsites.forEach(function(w) {
      html += `<tr>
        <td><strong>${w.name || 'Untitled'}</strong></td>
        <td><a href="${w.url}" target="_blank" rel="noopener noreferrer" style="color:var(--gold);text-decoration:underline;">${w.url || '-'} ↗</a></td>
        <td><span class="tech-badge" style="font-size:0.78rem;">${w.niche || 'Web'}</span></td>
        <td style="font-size:0.8rem;color:var(--t2);">${w.tech || 'Custom'}</td>
        <td><span style="color:#27c93f;font-weight:600;">⚡ ${w.speed || '98/100'}</span></td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="btn-outline btn-sm" onclick="window.editCmsWebsite('${w.id}')">✏️ Edit</button>
            <button class="btn-danger btn-sm" onclick="window.deleteCmsWebsite('${w.id}')">🗑️ Delete</button>
          </div>
        </td>
      </tr>`;
    });
    tbody.innerHTML = html;
  }

  window.filterCmsVideos = function(type) {
    currentVidFilter = type;
    var bAll = document.getElementById('vfilter-all');
    var bVert = document.getElementById('vfilter-vert');
    var bHoriz = document.getElementById('vfilter-horiz');
    if (bAll) bAll.className = type === 'all' ? 'btn-sm btn-gold' : 'btn-sm btn-outline';
    if (bVert) bVert.className = type === 'vertical' ? 'btn-sm btn-gold' : 'btn-sm btn-outline';
    if (bHoriz) bHoriz.className = type === 'horizontal' ? 'btn-sm btn-gold' : 'btn-sm btn-outline';
    renderCmsVideos();
  };

  window.resetVideoForm = function() {
    document.getElementById('vid-id').value = '';
    document.getElementById('vid-type').value = 'vertical';
    document.getElementById('vid-title').value = '';
    document.getElementById('vid-niche').value = '';
    document.getElementById('vid-order').value = (allCmsVideos.length + 1);
    document.getElementById('vid-url').value = '';
    document.getElementById('vid-poster').value = '';
    document.getElementById('btnSaveVideo').innerText = '💾 Save Video to Live Portfolio →';
  };

  window.editCmsVideo = function(id) {
    var v = allCmsVideos.find(function(item) { return item.id === id; });
    if (!v) return;
    document.getElementById('vid-id').value = v.id.startsWith('v') ? '' : v.id;
    document.getElementById('vid-type').value = v.type || 'vertical';
    document.getElementById('vid-title').value = v.title || '';
    document.getElementById('vid-niche').value = v.niche || '';
    document.getElementById('vid-order').value = v.order || 1;
    document.getElementById('vid-url').value = v.videoUrl || '';
    document.getElementById('vid-poster').value = v.posterUrl || '';
    document.getElementById('btnSaveVideo').innerText = '💾 Update Video Changes →';
    document.getElementById('videoForm').scrollIntoView({ behavior: 'smooth' });
  };

  window.savePortfolioVideoNow = async function() {
    var id = document.getElementById('vid-id').value;
    var type = document.getElementById('vid-type').value;
    var title = document.getElementById('vid-title').value.trim();
    var niche = document.getElementById('vid-niche').value.trim();
    var order = parseInt(document.getElementById('vid-order').value) || 1;
    var videoUrl = document.getElementById('vid-url').value.trim();
    var posterUrl = document.getElementById('vid-poster').value.trim();

    if (!title || !videoUrl) {
      alert('Please provide both Video Title and Video Stream URL.');
      return;
    }

    var btn = document.getElementById('btnSaveVideo');
    btn.disabled = true;
    btn.innerText = 'Saving to Live Portfolio...';

    try {
      var payload = {
        title: title,
        type: type,
        niche: niche || 'Creative',
        order: order,
        videoUrl: videoUrl,
        posterUrl: posterUrl,
        active: true,
        updatedAt: serverTimestamp()
      };

      if (id && !id.startsWith('v')) {
        await updateDoc(doc(db, 'portfolio_videos', id), payload);
      } else {
        payload.createdAt = serverTimestamp();
        await addDoc(collection(db, 'portfolio_videos'), payload);
      }

      window.resetVideoForm();
      alert('✅ Video saved successfully! It is now LIVE on editzaar.in/work in real-time.');
    } catch(err) {
      console.error('Error saving portfolio video:', err);
      alert('Error saving video: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = '💾 Save Video to Live Portfolio →';
    }
  };

  window.deleteCmsVideo = async function(id) {
    if (!confirm('Are you sure you want to remove this video from your live portfolio?')) return;
    try {
      if (id && !id.startsWith('v')) {
        await deleteDoc(doc(db, 'portfolio_videos', id));
      } else {
        allCmsVideos = allCmsVideos.filter(function(x) { return x.id !== id; });
        renderCmsVideos();
      }
      alert('✅ Video deleted from live portfolio.');
    } catch(err) {
      console.error('Error deleting video:', err);
      alert('Error: ' + err.message);
    }
  };

  window.resetWebsiteForm = function() {
    document.getElementById('web-id').value = '';
    document.getElementById('web-name').value = '';
    document.getElementById('web-url').value = '';
    document.getElementById('web-niche').value = '';
    document.getElementById('web-speed').value = '98/100';
    document.getElementById('web-tech').value = '';
    document.getElementById('web-order').value = (allCmsWebsites.length + 1);
    document.getElementById('web-screenshot').value = '';
    document.getElementById('btnSaveWeb').innerText = '💾 Save Website Project →';
  };

  window.editCmsWebsite = function(id) {
    var w = allCmsWebsites.find(function(item) { return item.id === id; });
    if (!w) return;
    document.getElementById('web-id').value = w.id.startsWith('w') ? '' : w.id;
    document.getElementById('web-name').value = w.name || '';
    document.getElementById('web-url').value = w.url || '';
    document.getElementById('web-niche').value = w.niche || '';
    document.getElementById('web-speed').value = w.speed || '98/100';
    document.getElementById('web-tech').value = w.tech || '';
    document.getElementById('web-order').value = w.order || 1;
    document.getElementById('web-screenshot').value = w.screenshot || '';
    document.getElementById('btnSaveWeb').innerText = '💾 Update Website Project →';
    document.getElementById('webForm').scrollIntoView({ behavior: 'smooth' });
  };

  window.savePortfolioWebsiteNow = async function() {
    var id = document.getElementById('web-id').value;
    var name = document.getElementById('web-name').value.trim();
    var url = document.getElementById('web-url').value.trim();
    var niche = document.getElementById('web-niche').value.trim();
    var speed = document.getElementById('web-speed').value.trim() || '98/100';
    var tech = document.getElementById('web-tech').value.trim();
    var order = parseInt(document.getElementById('web-order').value) || 1;
    var screenshot = document.getElementById('web-screenshot').value.trim();

    if (!name || !url) {
      alert('Please provide Website Name and URL.');
      return;
    }

    var btn = document.getElementById('btnSaveWeb');
    btn.disabled = true;
    btn.innerText = 'Saving Website...';

    try {
      var payload = {
        name: name,
        url: url,
        niche: niche || 'Web Development',
        speed: speed,
        tech: tech || 'HTML5, CSS3, JavaScript',
        order: order,
        screenshot: screenshot,
        active: true,
        updatedAt: serverTimestamp()
      };

      if (id && !id.startsWith('w')) {
        await updateDoc(doc(db, 'portfolio_websites', id), payload);
      } else {
        payload.createdAt = serverTimestamp();
        await addDoc(collection(db, 'portfolio_websites'), payload);
      }

      window.resetWebsiteForm();
      alert('✅ Website project saved successfully! It is now LIVE on editzaar.in/work.');
    } catch(err) {
      console.error('Error saving website:', err);
      alert('Error: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = '💾 Save Website Project →';
    }
  };

  window.deleteCmsWebsite = async function(id) {
    if (!confirm('Are you sure you want to remove this website from your live portfolio?')) return;
    try {
      if (id && !id.startsWith('w')) {
        await deleteDoc(doc(db, 'portfolio_websites', id));
      } else {
        allCmsWebsites = allCmsWebsites.filter(function(x) { return x.id !== id; });
        renderCmsWebsites();
      }
      alert('✅ Website project deleted from live portfolio.');
    } catch(err) {
      console.error('Error deleting website:', err);
      alert('Error: ' + err.message);
    }
  };

  window.seedDefaultPortfolioVideos = autoSeedVideosToFirestore;
  window.seedDefaultPortfolioWebsites = autoSeedWebsitesToFirestore;

</script>
