<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editzaar — Sign In or Create Account</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="icon" type="image/png" href="../media/fav-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/dashboard/css/dashboard.css"/>
  <style>
    .auth-bg-rings {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 1;
    }
    .auth-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(255,184,0,0.07);
      animation: authRingPulse 4s ease-out infinite;
    }
    @keyframes authRingPulse {
      0%{ transform: scale(0.9); opacity: 0.6; }
      100%{ transform: scale(1.2); opacity: 0; }
    }
    .auth-ring:nth-child(1){ width:300px; height:300px; animation-delay:0s; }
    .auth-ring:nth-child(2){ width:500px; height:500px; animation-delay:1.3s; }
    .auth-ring:nth-child(3){ width:700px; height:700px; animation-delay:2.6s; }

    .auth-tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 9px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--t2);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.25s;
    }
    .auth-tab.active {
      background: var(--gold);
      color: #000;
    }

    .auth-links-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }
    .back-link, .forgot-link {
      font-size: 11px;
      color: var(--t3);
      letter-spacing: 0.06em;
      transition: color 0.2s;
      cursor: pointer;
    }
    .back-link:hover, .forgot-link:hover { color: var(--gold); }

    .auth-success {
      background: rgba(40,200,64,0.1);
      border: 1px solid rgba(40,200,64,0.3);
      color: #28C840;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      display: none;
    }
    .auth-success.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg-rings">
      <div class="auth-ring"></div>
      <div class="auth-ring"></div>
      <div class="auth-ring"></div>
    </div>

    <div class="auth-box" style="position:relative;z-index:3;">
      <span class="auth-logo">EDIT<em>ZAAR</em></span>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabSignin">Sign In</div>
        <div class="auth-tab" id="tabSignup">Create Account</div>
      </div>

      <div class="auth-title" id="authTitle">Welcome back</div>
      <div class="auth-sub" id="authSub">Sign in to access your portal</div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <div class="auth-field" id="fieldFullname" style="display:none;">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="John Doe" autocomplete="name"/>
      </div>

      <div class="auth-field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button class="auth-btn" id="submitBtn">Sign In →</button>

      <div class="auth-links-row">
        <a href="../index.html" class="back-link">← Back to Editzaar.in</a>
        <span class="forgot-link" id="forgotBtn">Forgot password?</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp }         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged }
                                     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
                                     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyDSTSremZrVJJ7WXuNWgHokljC-i8r3esc",
      authDomain:        "editzaar-fa8d9.firebaseapp.com",
      projectId:         "editzaar-fa8d9",
      storageBucket:     "editzaar-fa8d9.firebasestorage.app",
      messagingSenderId: "419930711716",
      appId:             "1:419930711716:web:b1504f651e397a14726831",
      measurementId:     "G-2S8JKL6FDZ"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let mode = 'signin';

    /* Auto-redirect if already logged in */
    onAuthStateChanged(auth, async (user) => {
      if (user) { await redirectByRole(user.uid); }
    });

    async function redirectByRole(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (!snap.exists()) {
          // If Firestore profile doesn't exist yet, default to client
          location.href = '/dashboard/client.html';
          return;
        }
        const role = snap.data().role;
        if      (role === 'admin')  location.href = '/dashboard/admin.html';
        else if (role === 'editor') location.href = '/dashboard/editor.html';
        else                        location.href = '/dashboard/client.html';
      } catch(err) {
        console.error('Role redirect error:', err);
        location.href = '/dashboard/client.html';
      }
    }

    const tabSignin     = document.getElementById('tabSignin');
    const tabSignup     = document.getElementById('tabSignup');
    const authTitle     = document.getElementById('authTitle');
    const authSub       = document.getElementById('authSub');
    const fieldFullname = document.getElementById('fieldFullname');
    const submitBtn     = document.getElementById('submitBtn');
    const forgotBtn     = document.getElementById('forgotBtn');
    const nameEl        = document.getElementById('fullname');
    const emailEl       = document.getElementById('email');
    const passEl        = document.getElementById('password');
    const errorEl       = document.getElementById('authError');
    const successEl     = document.getElementById('authSuccess');

    tabSignin.addEventListener('click', () => setMode('signin'));
    tabSignup.addEventListener('click', () => setMode('signup'));

    function setMode(m) {
      mode = m;
      errorEl.classList.remove('show');
      successEl.classList.remove('show');

      if (mode === 'signin') {
        tabSignin.classList.add('active');
        tabSignup.classList.remove('active');
        authTitle.textContent = 'Welcome back';
        authSub.textContent = 'Sign in to access your portal';
        fieldFullname.style.display = 'none';
        submitBtn.textContent = 'Sign In →';
        submitBtn.disabled = false;
        forgotBtn.style.display = 'inline';
      } else {
        tabSignup.classList.add('active');
        tabSignin.classList.remove('active');
        authTitle.textContent = 'Create Client Account';
        authSub.textContent = 'Register to track projects and chat with editors';
        fieldFullname.style.display = 'block';
        submitBtn.textContent = 'Create Account →';
        submitBtn.disabled = false;
        forgotBtn.style.display = 'none';
      }
    }

    function showError(msg) {
      successEl.classList.remove('show');
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }

    function showSuccess(msg) {
      errorEl.classList.remove('show');
      successEl.textContent = msg;
      successEl.classList.add('show');
    }

    submitBtn.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      const pass  = passEl.value;
      const name  = nameEl.value.trim();

      if (mode === 'signin') {
        if (!email || !pass) { showError('Please enter your email and password.'); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';
        errorEl.classList.remove('show');
        try {
          const cred = await signInWithEmailAndPassword(auth, email, pass);
          await redirectByRole(cred.user.uid);
        } catch (e) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In →';
          const msgs = {
            'auth/invalid-credential': 'Invalid email or password. Please check your credentials or click "Create Account".',
            'auth/user-not-found':     'No account found with this email. Please click "Create Account" tab to register.',
            'auth/wrong-password':     'Incorrect password. Click "Forgot password?" below to reset it.',
            'auth/invalid-email':      'Please enter a valid email address.',
          };
          showError(msgs[e.code] || 'Sign-in failed. Please check your email and password.');
        } finally {
          if (submitBtn.textContent === 'Signing in…') {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In →';
          }
        }
      } else {
        if (!name || !email || !pass) { showError('Please fill in your name, email, and password.'); return; }
        if (pass.length < 6) { showError('Password must be at least 6 characters.'); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating Account…';
        errorEl.classList.remove('show');

        try {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          await setDoc(doc(db, 'users', cred.user.uid), {
            name: name,
            email: email,
            role: 'client',
            createdAt: serverTimestamp()
          });
          showSuccess('Account created! Redirecting to your dashboard…');
          setTimeout(() => { location.href = '/dashboard/client.html'; }, 800);
        } catch (e) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account →';
          const msgs = {
            'auth/email-already-in-use': 'An account already exists with this email address. Please click "Sign In" tab.',
            'auth/invalid-email':        'Please enter a valid email address.',
            'auth/weak-password':        'Password should be at least 6 characters.',
          };
          showError(msgs[e.code] || e.message || 'Registration failed.');
        } finally {
          if (submitBtn.textContent === 'Creating Account…') {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account →';
          }
        }
      }
    });

    forgotBtn.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      if (!email) {
        showError('Please type your email address first, then click Forgot Password.');
        emailEl.focus();
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showSuccess(`Password reset link sent to ${email}! Check your inbox.`);
      } catch (e) {
        showError('Could not send reset email. Please verify your email address.');
      }
    });

    [nameEl, emailEl, passEl].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });
    });
  </script>
</body>
</html>
